# OWeb satellite API: bundled Kaneo image (API + bundled web). Vercel serves the
# static web app; proxy /api from vercel.json to this app.
app = "kaneo-api-oweb"
primary_region = "iad"

[build]
image = "ghcr.io/usekaneo/kaneo:latest"

[http_service]
internal_port = 5173
force_https = true
auto_stop_machines = "stop"
auto_start_machines = true
min_machines_running = 0

[[http_service.checks]]
grace_period = "90s"
interval = "30s"
method = "GET"
path = "/api/health"
timeout = "5s"

[env]
KANEO_CLIENT_URL = "https://kaneo-oweb.vercel.app"

[[vm]]
memory = "1gb"
cpu_kind = "shared"
cpus = 1
